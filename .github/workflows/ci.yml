name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          test "$(xcodebuild -version)" = $'Xcode 26.5\nBuild version 17F42'
          xcrun --show-sdk-version
      - name: Test
        run: |
          python3 scripts/test_release_notes.py
          swift test
      - name: Build and verify universal DMG
        run: ./scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
